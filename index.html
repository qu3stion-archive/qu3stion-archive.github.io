<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Qu3stion Archive</title>
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="papaparse.min.js"></script>
    </head>
    <body onload="load()">
        <!-- TEMPLATE 1: images -->
        <template id="template_image">
            <article>
                <div class="src">
                    <button><img loading="lazy"></button>
                    <label class="div_id"></label>
                </div>
                <div class="tags">
                    
                </div>
            </article>
        </template>
        <!-- TEMPLATE 2: videos -->
        <template id="template_video">
            <article>
                <div class="src">
                    <button>
                        <video>
                        </video>
                    </button>
                    <label class="div_id"></label>
                </div>
                <div class="tags">

                </div>
            </article>
        </template>

        <div class="universal">
            <p id="status"></p>
            <div id="archive">
                <main>
                    <div id="viewer">
                    </div>
                </main>
                <nav>
                    <div class="search">
                        <button id="back" onclick="page(-1)">&lt;&lt;</button>
                        <select id="step">
                            <option value=1 selected>1</option>
                            <option value=5>5</option>
                            <option value=10>10</option>
                            <option value=20>20</option>
                            <option value=1000>End</option>
                        </select>
                        <button id="top" onclick="page(1)">&gt;&gt;</button>
                    </div>
                    <section class="explorer">
                    </section>
                </nav>
            </div>
        </div>
    </body>
    <script src="videos.js"></script>
</html>
