<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Qu3stion Archive</title>
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="papaparse.min.js"></script>
    </head>
    <body onload="load()" id="top">
        <!-- TEMPLATE 1: images -->
        <template id="template_image">
            <article>
                <div class="src">
                    <button><img loading="lazy"></button>
                    <label class="div_id"></label>
                </div>
                <div class="tags">
                    
                </div>
            </article>
        </template>
        <!-- TEMPLATE 2: videos -->
        <template id="template_video">
            <article>
                <div class="src">
                    <button>
                        <video>
                        </video>
                    </button>
                    <label class="div_id"></label>
                </div>
                <div class="tags">

                </div>
            </article>
        </template>

        <!-- Top button -->
        <a class="to-top" href="#top">
            <img src="https://www.svgrepo.com/show/506650/chevron-top.svg" alt="^">
        </a>

        <div class="universal">
            <p id="status"></p>
            <div id="archive">
                <main>
                    <div id="viewer">
                        <p>"#num: [MEDIA NAME?]"</p>
                        <p>Tags go here.....</p>
                        <textarea placeholder="Description of media / notes..."></textarea>
                    </div>
                </main>
                <nav class="gallery">

                    <div class="search">
                        <div id="page_buttons">
                            <select id="step">
                                <option value=1 selected>+1</option>
                                <option value=5>+5</option>
                                <option value=10>+10</option>
                                <option value=20>+20</option>
                                <option value=1000>End</option>
                            </select>
                            <button id="back" onclick="pagecrawl(-1)">&lt;&lt;</button>
                            <input id="page_counter">
                            <button id="top" onclick="pagecrawl(1)">&gt;&gt;</button>
                        </div>
                        <div id="tag_searching">
                            <button onclick="tags_popup()">eugh</button>
                                <div id="tags_selection" class="popup">
                                    "hi"
                                </div>
                        </div>
                    </div>

                    <section class="explorer">
                    </section>
                </nav>
            </div>
        </div>
        <div id="sidebar">
            <p>Hi! :^]</p>
        </div>
    </body>
    <script src="videos.js"></script>
</html>
