<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Qu3stion Archive</title>
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="papaparse.min.js"></script>
    </head>
    <body onload="load()" id="top">
        <!-- TEMPLATE 1: thumbnail -->
        <template id="template_">
            <article>
                <div class="src">
                    <button><img loading="lazy" class="thumbnail" preload="none"></button>
                    <label class="div_id"></label>
                </div>
                <div class="tags">
                    
                </div>
            </article>
        </template>

        <!-- TEMPLATE 2: expanded image -->
        <template id="template_imgEX">
            <img class="expanded" loading="eager" preload="none">
            <div class="tags"></div>
            <textarea class="notes" readonly></textarea>
        </template>

        <!-- TEMPLATE 3: expanded video -->
        <template id="template_vidEX">
            <video class="expanded" controls loading="eager" autoplay muted loop preload="none"></video>
            <div class="tags"></div>
            <textarea class="notes" readonly></textarea>
        </template>

        <!-- Top button -->
         <div id="overlay" class="out"></div>
        <div class="universal">
            <p id="status"></p>
            <div id="archive">
                <main>
                    <div id="viewer">
                    </div>
                </main>
                <nav class="gallery">
                    <div class="search">
                        <div id="page_buttons">
                            <select id="step">
                                <option value=1 selected>+1</option>
                                <option value=5>+5</option>
                                <option value=10>+10</option>
                                <option value=20>+20</option>
                                <option value=1000>End</option>
                            </select>
                            <button id="back" onclick="pagecrawl(-1)">&lt;&lt;</button>
                            <input id="page_counter">
                            <button id="top" onclick="pagecrawl(1)">&gt;&gt;</button>
                        </div>
                        <div>
                            
                        </div>
                    </div>

                    <section class="explorer">
                    </section>
                </nav>
            </div>
        </div>
        <div id="tagsBar" class="sidebar out">
            <div class="tagsMenu">
                <h1>Tags</h1>
            </div>
        </div>
        <div class="to-top">
            <a class="to-top" href="#top">
                <img src="https://www.svgrepo.com/show/506650/chevron-top.svg" alt="^">
            </a>
            <button class="to-top" onclick="sidebar()">
                <img src="https://www.svgrepo.com/show/509711/align-justify.svg" alt="=">
            </button>
        </div>
    </body>
    <script src="videos.js"></script>
</html>
