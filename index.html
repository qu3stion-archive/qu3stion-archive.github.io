<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Qu3stion Archive</title>
        <link href="style.css" rel="stylesheet" type="text/css" media="all">
        <script src="papaparse.min.js"></script>
    </head>
    <body onload="load()" id="top">
        <!-- TEMPLATE 1: Thumbnails -->
        <template id="template_">
            <article>
                <div class="src">
                    <button><img loading="lazy" class="thumbnail" preload="none"></button>
                    <label class="div_id"></label>
                </div>
                <div class="tags">
                    
                </div>
            </article>
        </template>

        <!-- TEMPLATE 2: Image -->
        <template id="template_img">
            <img class="expanded" loading="eager" preload="none">
            <div class="tags"></div>
            <textarea class="notes" readonly disabled></textarea>
        </template>

        <!-- TEMPLATE 3: Video -->
        <template id="template_vid">
            <video class="expanded" controls loading="eager" autoplay muted loop preload="none"></video>
            <div class="tags"></div>
            <textarea class="notes" readonly disabled></textarea>
        </template>

        <!-- Top button -->
         <div id="overlay" class="out"></div>
        <div class="universal">
            <div id="archive">
                <main>
                    <div id="viewer">
                    </div>
                </main>
                <nav class="gallery">
                    <section class="search">
                        <nav>
                            <select id="step" tabindex="1">
                                <option value=1 selected>+1</option>
                                <option value=5>+5</option>
                                <option value=10>+10</option>
                                <option value=20>+20</option>
                                <option value=50>+50</option>
                                <option value=1000>End</option>
                            </select>
                            <button id="back" tabindex="1" onclick="pagecrawl(-1)">&lt;&lt;</button>
                            <input id="page_counter" tabindex="1">
                            <button id="top" tabindex="1" onclick="pagecrawl(1)">&gt;&gt;</button>
                        </nav>
                        <span class="status"></span>
                    </section>
                    <section class="explorer">
                    </section>
                </nav>
            </div>
        </div>
        <div id="tagsBar" class="sidebar out">
            <div class="tagsMenu">
                <h1>Tags</h1>
            </div>
        </div>
        <div class="notification">
            <label id="statusAlt" class="status"></label>
        </div>
        <div class="screen" id="infoBox">
            <section class="infobox">
                <div class="drone">
                    <div>
                        <h1>Got Qu(e)stions?</h1>
                        <p>We have answ(e)rs! In the form of a form! Report all your...</p>
                        <ul>
                            <li>Bug reports</li>
                            <li>Qu(e)stions</li>
                            <li>Comments</li>
                            <li>Suggestions</li>
                        </ul>
                    </div>
                    <figure>
                        <img src="assets/drone4.png">
                        <!-- <div><p>Hallo! I am Drone #4! I am the manager & programmer of this archive!<br><br><a href="https://x.com/_drone4">Follow me on Twitter (@_drone4)</a> for development & form answers!</p></div>
                        -->
                    </figure>
                </div>
                <div class="info">

                </div>
            </section>
        </div>
        <div id="buttons" class="to-top">
            <button id="infoButton" class="to-top" tabindex="0" onclick="appear('infoBox')">
                <img src="https://www.svgrepo.com/show/513832/info-circle.svg" alt="Info">
            </button>
            <button id="tagsButton" class="to-top" tabindex="0" onclick="appear('tagsBar')">
                <img src="https://www.svgrepo.com/show/509711/align-justify.svg" alt="Search by Tags">
            </button>
            <a class="to-top" href="#top" tabindex="0">
                <img src="https://www.svgrepo.com/show/506650/chevron-top.svg" alt="Go to Top">
            </a>
        </div>
    </body>
    <script src="videos.js"></script>
</html>
