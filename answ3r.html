<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>¿</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <style>
            @font-face {
                font-family: "pixel";
                src: url("assets/fonts/pixel_operator.ttf") format("truetype");
            }
            body {
                background-color: black;
                font-family: "pixel", sans-serif;
                font-weight: bold;
                align-items: center;
                margin: 0;
            }
            #vid, #vidLoop, #vid3 {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
                z-index: 999;
            }
            #vidLoop, #vid3 {
                display: none;
            }
            #videocont {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            #videocont > img {
                width: 500px;
                height: 500px;
            }
            #videocont > p {
                height: 10px;
            }
        </style>
    </head>
    <body>

    <div id="videocont">
        <div id="man">
            <video id="vid" onclick="play()" autoplay preload="auto">
                <source src="assets/other/someone/someone.mp4" type="video/mp4" id="videosource">
            </video>
            <video id="vidLoop" preload="auto" loop onclick="playvid3()">
                <source src="assets/other/someone/someoneloop.mp4" type="video/mp4">
            </video>
            <video id="vid3" preload="auto">
                <source src="assets/other/someone/looking.mp4" type="video/mp4">
            </video>
        </div>
    </div>
    </body>
    <script>
    function play() {
        const v = document.getElementById('vid');
        v.play();
    }

    var player = document.getElementById('vid');
    var loop = document.getElementById('vidLoop');

    player.addEventListener('ended', loopvideo, false);

    function loopvideo(e) {
        player.style.display = 'none';
        loop.style.display = 'block';
        loop.play();
    }
    function playVid3() {
    loop.pause();
    loop.style.display = 'none';
    vid3.style.display = 'block';
    vid3.play();
    }
    
    loop.addEventListener('click', playVid3);
    vid3.addEventListener('ended', function() {
    window.location.href = "https://qu3stion-archive.github.io/";
    });

    </script>
    
</html>
